<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="background-container"></div>

    <div class="weather-card">
        <div class="header-container">
            <h2 class="header-title">WeatherWise</h2>
            <button id="theme-toggle" class="theme-toggle-button"></button>
        </div>

        <div class="search-container">
            <input type="text" id="city-input" placeholder="Enter city name..." class="input-field">
            <button id="search-btn" class="search-button">
                <svg xmlns="http://www.w3.org/2000/svg" class="icon" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                </svg>
            </button>
        </div>

        <div id="weather-display" class="hidden">
            <img id="weather-icon" src="" alt="Weather Icon">
            <h1 id="temperature"></h1>
            <h2 id="city-name"></h2>
            <p id="weather-description"></p>
            <div class="info-container">
                <div class="info-item">
                    <p id="humidity"></p>
                    <p class="sub-text">Humidity</p>
                </div>
                <div class="info-item">
                    <p id="wind-speed"></p>
                    <p class="sub-text">Wind Speed</p>
                </div>
            </div>
        </div>
        
        <div id="message-display">
            <p>Enter a city to get the weather!</p>
        </div>
    </div>

    <script src="script.js" defer></script>
</body>
</html>
